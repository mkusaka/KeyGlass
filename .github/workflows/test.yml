name: Test
on:
  workflow_call:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.1
          cache: false
      - name: Show Swift toolchain
        run: |
          xcrun swift --version
          xcodebuild -version
      - name: SwiftFormat check
        run: mise exec -- swiftformat --lint .
      - name: SwiftLint check
        run: mise exec -- swiftlint lint --quiet
    timeout-minutes: 60
  unit-test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Swift toolchain
        run: |
          xcrun swift --version
          xcodebuild -version
      - name: Run tests
        run: |
          xcodebuild -project KeyGlass.xcodeproj \
            -scheme KeyGlass \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            test
    timeout-minutes: 60
